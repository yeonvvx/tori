name: Build Electron App

on:
  workflow_call:
    #    secrets:
    #      SUBMODULE_PAT:
    #        required: true
    outputs:
      appVersion:
        description: "The version of the app"
        value: ${{ jobs.build-electron.outputs.app_version }}

jobs:

env:
  GOSUMDB: off
  GONOSUMCHECK: "*"

  build-electron:
    strategy:
      fail-fast: false
      matrix:
        # IDs:
        # - tori-darwin-arm
        # - tori-darwin-intel
        # - tori-linux
        # - tori-windows
        include:
          # For Mac
          - os: 'macos-latest'
            id: 'tori-darwin-arm64'
            go_binary_id: 'tori-server-darwin' # Artifact: go-tori-server-darwin (contains both arm64 and x86_64)
            electron_args: '--mac --arm64'
            mpv_prism_target: 'darwin-arm64'
          # For Linux
          - os: 'ubuntu-latest'
            id: 'tori-linux-x64'
            go_binary_id: 'tori-server-linux' # Artifact: go-tori-server-linux (contains x86_64)
            electron_args: '--linux --x64'
            mpv_prism_target: 'linux-x64'
          # For Windows
          - os: 'windows-latest'
            id: 'tori-windows-x64'
            go_binary_id: 'tori-server-windows' # Artifact: go-tori-server-windows (contains x86_64)
            electron_args: '--win --x64'
            mpv_prism_target: 'win32-x64'

    runs-on: ${{ matrix.os }}
    outputs:
      app_version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code and submodules 📂
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      #          submodules: recursive
      #          lfs: true
      #          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get package version 📦
        id: get-version
        run: |
          NODE_VERSION=$(node -p "require('./tori-desktop/package.json').version")
          echo "version=$NODE_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      # Install dependencies
      - name: Install dependencies (Ubuntu) 📦
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnss3-dev libxss-dev libasound2-dev

      # Download the web folders
      # TODO Uncomment if building web
      - name: Download web folder artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: web-denshi
          path: web-denshi

      # Move web-denshi folder into tori
      - name: Move web-denshi folder 🚚
        run: mv web-denshi tori-desktop/
        shell: bash

      - name: Ensure binaries folder exists (UNIX)
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        run: mkdir -p ./tori-desktop/binaries

      - name: Ensure binaries folder exists (Windows)
        if: matrix.os == 'windows-latest'
        run: mkdir .\tori-desktop\binaries

      # Download the server binaries based on matrix.go_binary_id
      - name: Download server binaries 📥
        uses: actions/download-artifact@v4
        with:
          name: go-${{ matrix.go_binary_id }}
          path: ./tori-desktop/binaries

      # Extract server binaries
      #      - name: Extract server binaries (macOS x64) 📂
      #        if: matrix.os == 'macos-latest' && matrix.id == 'tori-darwin-x64'
      #        # Extracts tori-server-darwin-arm64 and tori-server-darwin-amd64
      #        # Only keep tori-server-darwin-amd64
      #        run: |
      #          tar -xf ./tori-desktop/binaries/binaries-${{ matrix.go_binary_id }}.tar -C ./tori-desktop/binaries
      #          # Remove the other binary
      #          rm -rf ./tori-desktop/binaries/tori-server-darwin-arm64

      - name: Extract server binaries (macOS arm64) 📂
        if: matrix.os == 'macos-latest' && matrix.id == 'tori-darwin-arm64'
        # Extracts tori-server-darwin-arm64 and tori-server-darwin-amd64
        # Only keep tori-server-darwin-arm64
        run: |
          tar -xf ./tori-desktop/binaries/binaries-${{ matrix.go_binary_id }}.tar -C ./tori-desktop/binaries
          # Remove the other binary
          rm -rf ./tori-desktop/binaries/tori-server-darwin-amd64
          rm -rf ./tori-desktop/binaries/binaries-${{ matrix.go_binary_id }}.tar

      - name: Extract server binaries (Linux) 📂
        if: matrix.os == 'ubuntu-latest' && matrix.id == 'tori-linux-x64'
        # Extracts tori-server-linux-amd64
        run: |
          tar -xf ./tori-desktop/binaries/binaries-${{ matrix.go_binary_id }}.tar -C ./tori-desktop/binaries
          rm -rf ./tori-desktop/binaries/binaries-${{ matrix.go_binary_id }}.tar

      - name: Extract server binaries (Windows) 📂
        if: matrix.os == 'windows-latest'
        # Extracts tori-server-windows-amd64
        run: |
          7z x ".\tori-desktop\binaries\binaries-${{ matrix.go_binary_id }}.zip" "-o./tori-desktop/binaries/"
          del ".\tori-desktop\binaries\binaries-${{ matrix.go_binary_id }}.zip"

      #      # Copy app icon
      #      - name: Copy app icon 📝
      #        run: |
      #          mkdir -p ./tori/assets
      #          cp ./tori-desktop/src-tauri/app-icon.png ./tori/assets/
      #        shell: bash

      # Install and build
      - name: Install and build 📦️
        run: |
          cd tori-desktop
          npm ci
          npm run build:main
          npm run sync:mpv-prism -- ${{ matrix.mpv_prism_target }}
          npx electron-builder build ${{ matrix.electron_args }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the artifacts
      - name: Upload Electron artifacts 📤
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.id }}
          path: |
            ./tori-desktop/dist/tori-*
            ./tori-desktop/dist/*.yml
