<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tori Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Documentation for Tori — a self-hosted anime & manga media server.">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --base-color: #c9c9d6;
      --border-color: rgba(255,255,255,.08);
      --code-theme-background: #14141c;
      --sidebar-background: #101017;
      --sidebar-nav-link-before-content: '';
      --theme-color: #6366f1;
      --link-color: #818cf8;
      --link-color--hover: #a5b4fc;
    }
    body {
      background: #0c0c10 !important;
    }
    .app-name-link img { display: none; }
    .sidebar {
      border-right: 1px solid var(--border-color);
    }
    .sidebar > h1 {
      margin: 0 0 .5em;
    }
    .sidebar > h1 .app-name-link {
      display: flex;
      align-items: center;
      gap: .5em;
      font-weight: 700;
      letter-spacing: .02em;
      color: #f4f4f8 !important;
    }
    .sidebar ul li a {
      color: #9a9ab0;
    }
    .sidebar ul li a:hover,
    .sidebar ul li.active > a {
      color: var(--link-color--hover);
    }
    .sidebar-nav > ul > li > p {
      color: #55556b;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: .08em;
      font-weight: 700;
    }
    .markdown-section {
      max-width: 820px;
    }
    .markdown-section h1 {
      color: #f4f4f8;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: .3em;
    }
    .markdown-section h2 {
      color: #e4e4ec;
      border-top: 1px solid var(--border-color);
      padding-top: 1.2em;
      margin-top: 2em;
    }
    .markdown-section p, .markdown-section li {
      color: #c9c9d6;
    }
    .markdown-section a {
      color: var(--link-color);
    }
    .markdown-section code {
      color: #c7d2fe;
      background: #191924;
    }
    .markdown-section pre {
      background: var(--code-theme-background) !important;
      border: 1px solid var(--border-color);
    }
    .markdown-section table th, .markdown-section table td {
      border-color: var(--border-color);
    }
    .markdown-section table tr {
      background: transparent;
      border-top: 1px solid var(--border-color);
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background: rgba(99,102,241,.08);
      color: #d6d6e2;
    }
    .search input {
      background: #14141c;
      border: 1px solid var(--border-color);
      color: #e4e4ec;
    }
    .app-nav a {
      color: #9a9ab0;
    }
    .app-nav a:hover { color: var(--link-color--hover); }
    .content { padding-top: 20px; }
    .cover-main { color: #f4f4f8; }
    #tori-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      background: #0c0c10ee;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      z-index: 20;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #tori-topbar .torii {
      font-size: 20px;
    }
    #tori-topbar .brand {
      color: #f4f4f8;
      font-weight: 700;
      letter-spacing: .02em;
      text-decoration: none;
    }
    #tori-topbar .brand span {
      color: #818cf8;
    }
    #tori-topbar .spacer { flex: 1; }
    #tori-topbar a.gh {
      color: #9a9ab0;
      text-decoration: none;
      font-size: 14px;
    }
    #tori-topbar a.gh:hover { color: #c9c9d6; }
    .sidebar, .content { margin-top: 54px; }
    body > main { margin-top: 0; }
  </style>
</head>
<body>
  <div id="tori-topbar">
    <span class="torii">⛩️</span>
    <a class="brand" href="#/">Tori<span> Docs</span></a>
    <div class="spacer"></div>
    <a class="gh" href="https://github.com/yeonvvx/tori" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs...',
        noData: 'No results.',
        depth: 3,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      formatUpdated: '{MM}/{DD}/{YYYY}',
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-toml.min.js"></script>
</body>
</html>
